<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>동영상 제작기 — ECOLEVER</title>
<link rel="icon" type="image/png" href="../imgs/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Black+Han+Sans&family=Gowun+Batang:wght@400;700&family=Jua&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">🎬 <b>동영상 제작기</b><span>사진·영상·자막·음악으로 바로 만드는 영상</span></div>
  <div class="top-actions">
    <label class="btn">📁 파일 추가<input type="file" id="fileInput" multiple accept="image/*,video/*,audio/*" hidden></label>
    <button class="btn" id="addTextBtn">＋ 텍스트 슬라이드</button>
    <button class="btn btn-accent" id="exportBtn">⬇ 동영상 만들기</button>
  </div>
</header>

<main class="layout">
  <!-- 미디어 보관함 -->
  <aside class="panel library">
    <div class="panel-head">미디어 보관함 <small id="libCount"></small></div>
    <label class="auto-add"><input type="checkbox" id="autoAdd" checked> 업로드하면 타임라인에 자동 추가</label>
    <div id="libList" class="lib-list"></div>
    <div class="drop-hint" id="dropHint">사진 · 동영상 · 음악 파일을<br>여기로 끌어다 놓거나<br><b>📁 파일 추가</b>를 누르세요</div>
  </aside>

  <!-- 미리보기 -->
  <section class="stage-wrap">
    <div class="stage-box" id="stageBox"><canvas id="stage" width="1280" height="720"></canvas></div>
    <div class="transport">
      <button class="icon-btn" id="toStartBtn" title="처음으로">⏮</button>
      <button class="icon-btn play" id="playBtn" title="재생 / 일시정지 (Space)">▶</button>
      <span class="time"><span id="curTime">0:00.0</span> / <span id="totTime">0:00.0</span></span>
      <input type="range" id="seek" min="0" max="1000" value="0" step="1">
    </div>
  </section>

  <!-- 속성 -->
  <aside class="panel props">
    <div class="tabs">
      <button class="tab active" data-tab="clip">클립</button>
      <button class="tab" data-tab="project">프로젝트</button>
    </div>
    <div class="tab-body" id="clipTab"><p class="empty">타임라인에서 클립을 선택하세요.</p></div>
    <div class="tab-body" id="projectTab" hidden>
      <div class="field"><label>화면 비율</label>
        <div class="seg" id="aspectSeg">
          <button data-v="16:9" class="on">16:9 가로</button>
          <button data-v="9:16">9:16 쇼츠·릴스</button>
          <button data-v="1:1">1:1 정사각</button>
          <button data-v="4:5">4:5 피드</button>
        </div>
      </div>
      <div class="field"><label>화질</label>
        <select id="quality"><option value="480">480p (빠름)</option><option value="720" selected>720p HD</option><option value="1080">1080p FHD</option></select>
      </div>
      <div class="field"><label>프레임</label>
        <select id="fps"><option value="24">24fps</option><option value="30" selected>30fps</option><option value="60">60fps</option></select>
      </div>
      <div class="field"><label>배경색</label><input type="color" id="bgColor" value="#000000"></div>
      <hr>
      <div class="field"><label>배경음악</label><select id="bgmSelect"></select></div>
      <div class="field"><label>배경음악 볼륨 <output id="bgmVolOut">60%</output></label><input type="range" id="bgmVol" min="0" max="1" step="0.01" value="0.6"></div>
      <label class="check"><input type="checkbox" id="bgmFade" checked> 끝날 때 음악 서서히 줄이기</label>
      <hr>
      <div class="field"><label>로고 · 워터마크</label><select id="logoSelect"></select></div>
      <div class="field"><label>로고 위치</label>
        <select id="logoPos"><option value="tr">오른쪽 위</option><option value="tl">왼쪽 위</option><option value="br">오른쪽 아래</option><option value="bl">왼쪽 아래</option></select>
      </div>
      <div class="field"><label>로고 크기 <output id="logoSizeOut">16%</output></label><input type="range" id="logoSize" min="0.06" max="0.4" step="0.01" value="0.16"></div>
      <hr>
      <label class="check"><input type="checkbox" id="muteExport" checked> 동영상 만드는 동안 스피커 소리 끄기</label>
    </div>
  </aside>

  <!-- 타임라인 -->
  <section class="timeline-wrap">
    <div class="tl-toolbar">
      <span class="tl-title">타임라인</span>
      <span class="tl-hint">클립을 끌어서 순서 변경 · 클릭해서 편집 · Delete 키로 삭제</span>
      <label class="zoom">확대 <input type="range" id="tlZoom" min="20" max="200" value="70"></label>
    </div>
    <div class="timeline" id="timeline">
      <div class="tl-inner" id="tlInner">
        <div class="ruler" id="ruler"></div>
        <div class="track" id="track"></div>
        <div class="playhead" id="playhead"></div>
      </div>
    </div>
  </section>
</main>

<!-- 내보내기 진행 -->
<div class="modal" id="exportModal" hidden>
  <div class="modal-card">
    <h2 id="exportTitle">동영상을 만드는 중…</h2>
    <p class="muted" id="exportNote">영상 길이만큼 실시간으로 녹화합니다. 이 탭을 닫거나 다른 탭으로 전환하지 마세요.</p>
    <div class="progress"><div id="exportBar"></div></div>
    <p class="muted" id="exportPct">0%</p>
    <div class="modal-actions">
      <a class="btn btn-accent" id="downloadLink" hidden>⬇ 다운로드</a>
      <button class="btn" id="exportCancel">취소</button>
    </div>
    <video id="resultVideo" controls playsinline hidden></video>
  </div>
</div>

<div id="videoPool" aria-hidden="true"></div>
<script src="app.js"></script>
</body>
</html>
