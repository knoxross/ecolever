# main 브랜치에 올라오면 가이드 페이지를 다시 만들고 가비아 웹호스팅으로 자동 업로드합니다.
# 최초 1회 설정: GitHub 저장소 Settings → Secrets and variables → Actions 에
#   FTP_USER, FTP_PASSWORD 두 개를 등록하세요. (비밀번호는 저장소 파일에 절대 넣지 않습니다)
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build guides
        run: python3 tools/build_guides.py
      - name: Upload to Gabia via FTP
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::warning::FTP_USER / FTP_PASSWORD secrets are not set; skipping upload."; exit 0
          fi
          umask 077
          printf 'machine 211.47.74.75\nlogin %s\npassword %s\n' "$FTP_USER" "$FTP_PASSWORD" > "$RUNNER_TEMP/netrc"
          echo "--- FTP 접속 진단(비밀번호는 GitHub가 가림) ---"; curl -v --disable-epsv --netrc-file "$RUNNER_TEMP/netrc" --list-only -m 30 "ftp://211.47.74.75/" 2>&1 | grep -E "^(<|\* (Connected|Trying|Recv|Closing|connect))" | grep -v "PASS" | head -20 || true
          LIST=$(curl -sS --disable-epsv --retry 2 --retry-delay 3 --netrc-file "$RUNNER_TEMP/netrc" --list-only -m 30 "ftp://211.47.74.75/" || true)
          WEB=""
          for c in www public_html html htdocs; do if printf '%s\n' "$LIST" | sed 's#.*/##' | grep -qx "$c"; then WEB="$c/"; break; fi; done
          echo "web folder: /$WEB"
          shopt -s nullglob
          for f in index.html .htaccess robots.txt sitemap.xml llms.txt abf0e43b3caf459fadaf9491a62b47d9.txt css/* js/* imgs/* guide/*; do
            [ -f "$f" ] || continue
            curl -sS --disable-epsv --retry 2 --retry-delay 3 --netrc-file "$RUNNER_TEMP/netrc" --ftp-create-dirs -m 60 -T "$f" "ftp://211.47.74.75/$WEB$f"
            echo "uploaded $f"
          done
          printf "actions %s %s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_SHA" > "$RUNNER_TEMP/deploy-stamp.txt"
          curl -sS --disable-epsv --retry 2 --retry-delay 3 --netrc-file "$RUNNER_TEMP/netrc" -m 30 -T "$RUNNER_TEMP/deploy-stamp.txt" "ftp://211.47.74.75/${WEB}deploy-stamp.txt" || true
          rm -f "$RUNNER_TEMP/netrc"
      - name: IndexNow ping (Bing·Naver·Yandex 등에 새 주소 알림)
        run: |
          KEY=abf0e43b3caf459fadaf9491a62b47d9
          URLS=$(curl -s -m 30 https://www.ecolever.co.kr/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed 's#</\?loc>##g' | head -200 | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          BODY=$(python3 -c 'import json,sys;print(json.dumps({"host":"www.ecolever.co.kr","key":sys.argv[1],"keyLocation":"https://www.ecolever.co.kr/"+sys.argv[1]+".txt","urlList":json.loads(sys.argv[2])}))' "$KEY" "$URLS")
          for ep in https://api.indexnow.org/indexnow https://searchadvisor.naver.com/indexnow; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 -X POST -H 'Content-Type: application/json; charset=utf-8' --data "$BODY" "$ep" || true); echo "$ep -> $code"
          done
